name: Release merged changes

# A source pull request never receives a version commit. CI verifies the merged
# main commit first; only then does trusted code select the highest release
# label since the latest tag and commit the version bump directly to main.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump version on main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: write
      contents: write

    steps:
      # workflow_run uses the workflow from the default branch. Only trusted
      # code from main is checked out; a pull request head is never executed.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Select the current main commit
        id: current
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git switch -C main origin/main

          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$(git rev-parse HEAD)" != "$VERIFIED_SHA" ]; then
            echo "::notice::A newer main commit already exists; its CI run will prepare the release."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify the release baseline
        id: baseline
        if: steps.current.outputs.ready == 'true'
        run: |
          BASE_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          TAG_VERSION="${BASE_TAG#v}"
          MAIN_VERSION="$(node -p "require('./package.json').version")"

          if [ "$MAIN_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::main is version $MAIN_VERSION but the latest tag is $BASE_TAG. Repair that release with release.yml before bumping again."
            exit 1
          fi

          echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Collect merged release decisions
        id: decision
        if: steps.current.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BASE_BRANCH: main
          RELEASE_BASE_TAG: ${{ steps.baseline.outputs.base_tag }}
        run: node scripts/collect-release-decision.mjs

      - name: Commit the version bump to main
        id: release
        if: steps.current.outputs.ready == 'true' && steps.decision.outputs.bump != 'skip'
        env:
          BUMP: ${{ steps.decision.outputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version --allow-same-version > /dev/null
          TARGET="$(node -p "require('./package.json').version")"
          node scripts/release-changelog.mjs "$TARGET" "$(date -u +%Y-%m-%d)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore(release): v$TARGET"
          git push origin HEAD:refs/heads/main

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$TARGET" >> "$GITHUB_OUTPUT"

      # npm validates the workflow that starts a run. Dispatching release.yml
      # preserves its trusted-publisher identity; workflow_call would expose
      # bump.yml as the caller and fail npm authentication.
      - name: Dispatch and wait for the release
        if: steps.current.outputs.ready == 'true' && steps.decision.outputs.bump != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          RUN_TITLE="Release $RELEASE_SHA ($GITHUB_RUN_ID)"
          gh workflow run release.yml \
            --ref main \
            --field ref="$RELEASE_SHA" \
            --field request_id="$GITHUB_RUN_ID"

          RELEASE_RUN_ID=""
          for _ in $(seq 1 30); do
            RELEASE_RUN_ID="$(
              gh run list \
                --workflow release.yml \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,displayTitle \
                --jq ".[] | select(.displayTitle == \"$RUN_TITLE\") | .databaseId" \
                | head -n 1
            )"

            if [ -n "$RELEASE_RUN_ID" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$RELEASE_RUN_ID" ]; then
            echo "::error::Could not find the dispatched release workflow run."
            exit 1
          fi

          gh run watch "$RELEASE_RUN_ID" --exit-status
