name: Release
run-name: Release ${{ inputs.ref || github.sha }} (${{ inputs.request_id || 'manual' }})

# The post-merge workflow dispatches this file with the exact version-bump commit.
# Manual dispatch remains available to repair an interrupted npm publish, tag,
# or GitHub Release without incrementing the version again.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit containing the version to release
        required: false
        type: string
      request_id:
        description: Release preparation run that requested this release
        required: false
        type: string
  push:
    branches: [main]
    paths: ["package.json"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Check for an unpublished version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - id: check
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          set +e
          VERSIONS="$(npm view "$NAME" versions --json 2>&1)"
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ]; then
            if printf '%s' "$VERSIONS" | grep -q 'E404'; then
              echo "$NAME has never been published. Releasing $VERSION."
              echo "publish=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Could not reach the npm registry for $NAME"
            printf '%s\n' "$VERSIONS"
            exit 1
          fi

          if printf '%s' "$VERSIONS" | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => (raw += chunk));
            process.stdin.on("end", () => {
              const parsed = JSON.parse(raw);
              const all = Array.isArray(parsed) ? parsed : [parsed];
              process.exit(all.includes(process.argv[1]) ? 0 : 1);
            });
          ' "$VERSION"; then
            echo "$NAME@$VERSION is already on npm. Skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is not on npm. Releasing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release v${{ needs.check.outputs.version }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: oven-sh/setup-bun@v2
        if: needs.check.outputs.publish == 'true'
        with:
          bun-version: latest

      - uses: actions/setup-node@v7
        if: needs.check.outputs.publish == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use an npm that supports trusted publishing
        if: needs.check.outputs.publish == 'true'
        run: npm install --global npm@latest

      - name: Install dependencies
        if: needs.check.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Format
        if: needs.check.outputs.publish == 'true'
        run: bun run format:check

      - name: Lint
        if: needs.check.outputs.publish == 'true'
        run: bun run lint

      - name: Typecheck
        if: needs.check.outputs.publish == 'true'
        run: bun run typecheck

      - name: Test
        if: needs.check.outputs.publish == 'true'
        run: bun test

      - name: Build
        if: needs.check.outputs.publish == 'true'
        run: bun run build

      - name: Publish to npm
        if: needs.check.outputs.publish == 'true'
        run: npm publish --provenance --access public

      - name: Tag and create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          TAG="v$VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "::notice::Tag $TAG already exists on the remote. Leaving it as is."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists. Leaving it as is."
            exit 0
          fi

          NOTES="$RUNNER_TEMP/release-notes.md"
          awk -v header="## [$VERSION]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES"

          if grep -q '[^[:space:]]' "$NOTES"; then
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
