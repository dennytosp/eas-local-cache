name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # macOS matters here: the plugin prefers `ditto` for copying .app
        # bundles and uses Node's recursive copy elsewhere. Both paths run here.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard package version
        run: |
          BASE_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          RELEASED_VERSION="${BASE_TAG#v}" node scripts/check-release-version.mjs

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Install example dependencies
        run: bun install --cwd example --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Verify example integration
        run: bun run --cwd example check

      - name: Verify published files
        run: |
          test -f build/index.js
          test -f build/index.d.ts
          test -f build/cli-bin.js
          node build/cli-bin.js --help
          node build/cli-bin.js stats --project-root example --json
          npm pack --dry-run
