version: 2

# Two pull requests per ecosystem at most, not one per dependency.
#
# Minor and patch updates travel together: they are routine, they either all
# pass CI or the group tells you which one broke. Majors travel in a separate
# group because that is where breaking changes live — TypeScript 7 removing
# `moduleResolution=node10` should not be able to hold four harmless bumps
# hostage in the same pull request.
#
# Dependabot pull requests use the default patch release when they pass CI.
# Add `release:skip` manually only when a dependency update must not publish.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major-updates:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
